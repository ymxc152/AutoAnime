[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoanime"
version = "2.0.0.dev0"
description = "Local-first anime library automation"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "anitopy>=2.1.1",
  "httpx>=0.27",
]

[project.scripts]
autoanime = "autoanime.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["autoanime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
include = [
  "autoanime/**/*.py",
  "tests/**/*.py",
  "scripts/validate_l1_corpus.py",
  "scripts/validate_l2_corpus.py",
  "scripts/validate_l3_corpus.py",
]
exclude = ["autoanime/alembic/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["autoanime", "tests", "scripts/validate_l1_corpus.py", "scripts/validate_l2_corpus.py", "scripts/validate_l3_corpus.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"


