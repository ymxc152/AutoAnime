<!doctype html>
<html lang="zh-CN">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoAnime</title>
    <script>
      // 主题在首帧前确定,避免闪烁;不做切换动画(第一版纪律)。
      // 未手动选择过主题时跟随系统偏好(12-A:修复系统暗色用户首屏仍浅色)。
      try {
        var theme = localStorage.getItem('autoanime-theme')
        if (
          theme === 'dark' ||
          (theme === null && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        /* localStorage 不可用时维持浅色 */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
