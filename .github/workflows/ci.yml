name: CI

on:
  push:
    branches:
      - v2
      - "task/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Ruff
        run: uv run --python 3.12 ruff check

      - name: Pyright
        run: uv run --python 3.12 pyright

      - name: Pytest
        run: uv run --python 3.12 pytest
